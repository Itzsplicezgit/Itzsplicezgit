<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaglermod Archive</title>

<style>
body {
    margin: 0;
    background: white;
    color: black;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 30px;
}

.search {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 25px;
    box-sizing: border-box;
}

.file {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 15px;
}

.file img {
    width: 80px;
    height: 80px;
    object-fit: contain;
}

.info h2 {
    margin: 0 0 8px;
}

.author {
    color: #333;
    margin-bottom: 5px;
}

.date {
    color: #777;
    margin-bottom: 12px;
}

button {
    background: #ddd;
    color: #777;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #ccc;
}
</style>
</head>

<body>

<div class="container">

<h1>Eaglermod Archive</h1>

<input class="search" id="search" placeholder="Search files..." onkeyup="searchFiles()">

<div id="files">

    <div class="file">
        <img src="assets/tbs.png" alt="The Broken Script">

        <div class="info">
            <h2>thebrokenscript.html</h2>

            <div class="author">
                Author: @Itzsplicez
            </div>

            <div class="date">
                Releasing August 15
            </div>

            <a href="https://drive.google.com/file/d/1GUtMP5_Ji4-oiB1YoV6vx0edu3nn19Uq/view?usp=sharing" target="_blank" rel="noopener noreferrer">
                <button type="button">
                    Download
                </button>
            </a>
        </div>
    </div>

</div>

</div>

<script>
function searchFiles() {
    let input = document.getElementById("search").value.toLowerCase();
    let files = document.querySelectorAll(".file");

    files.forEach(file => {
        file.style.display = file.innerText.toLowerCase().includes(input)
            ? "flex"
            : "none";
    });
}
</script>

</body>
</html>
